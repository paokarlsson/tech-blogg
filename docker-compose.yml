services:
  dev:
    image: node:22-alpine
    user: "node"
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    command: sh -c "npm install && npm run serve -- --port 8080"

  build:
    image: node:22-alpine
    user: "node"
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm run build"
